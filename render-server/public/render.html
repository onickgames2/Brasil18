<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>html,body{margin:0;background:transparent}</style>

  <!-- PRÉ-LOAD -->
  <link rel="modulepreload" href="/vendor/three/build/three.module.js" />
  <link rel="modulepreload" href="/vendor/three/examples/jsm/loaders/GLTFLoader.js" />
  <link rel="preload" href="/noob_r6.glb" as="fetch" crossorigin />

  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const FOV = 30;
const MAX_CACHE = 300;
const MODEL_URL = "/noob_r6.glb";

// Tamanho do template do Roblox (shirt/pants): 585x559
const TW = 585, TH = 559;

// Cor original (amarelo) do rosto/cabeça na textura da cabeça
const ORIGINAL_SKIN = [245, 205, 48];

// Cores padrão (BodyColors). Se faltar alguma:
//   leftArm -> head, rightArm -> leftArm, rightLeg -> leftLeg
const DEFAULT_COLORS = {
  head: "#f5cd30",
  torso: "#0d69ac",
  leftLeg: "#a4bd47",
};

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

/* ------------------------------------------------------------------ */
/*  Setup ÚNICO                                                        */
/* ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
scene.add(new THREE.AmbientLight(0xffffff, 0.65 * Math.PI));
const sun = new THREE.DirectionalLight(0xffffff, 1.0 * Math.PI);
sun.position.set(4, 8, 6);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.25 * Math.PI);
fill.position.set(-5, 2, 4);
scene.add(fill);

const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 100);

/* ------------------------------------------------------------------ */
/*  Modelo base (6 partes: Head, Torso, LeftArm, RightArm, LeftLeg,    */
/*  RightLeg). UVs das partes do corpo = layout do template do Roblox. */
/*  O novo modelo já olha para +Z, então NÃO precisa girar.            */
/* ------------------------------------------------------------------ */
let base = null; // { model, height, headSource: ImageData }

async function loadBase() {
  const gltf = await new GLTFLoader().loadAsync(MODEL_URL);
  const model = gltf.scene;
  model.updateMatrixWorld(true);

  // Centraliza em X/Z e apoia os pés em y = 0
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  model.position.set(-center.x, -box.min.y, -center.z);
  model.updateMatrixWorld(true);
  const height = box.max.y - box.min.y;

  // Pixels originais da textura da cabeça (rosto) — guardados 1 vez
  let headSource = null;
  model.traverse((o) => {
    if (headSource || !o.isMesh || partOf(o.name) !== "Head") return;
    const img = o.material.map.image;
    const c = document.createElement("canvas");
    c.width = img.width;
    c.height = img.height;
    const ctx = c.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(img, 0, 0);
    headSource = ctx.getImageData(0, 0, c.width, c.height);
  });

  return { model, height, headSource };
}

function partOf(name) {
  const m = /^(Head|Torso|LeftArm|RightArm|LeftLeg|RightLeg)/.exec(name || "");
  return m ? m[1] : null;
}

/* ------------------------------------------------------------------ */
/*  Texturas                                                           */
/* ------------------------------------------------------------------ */
const imageCache = new Map();
function loadImage(url) {
  if (!url) return Promise.resolve(null);
  if (!imageCache.has(url)) {
    imageCache.set(url, new Promise((resolve) => {
      const img = new Image();
      img.crossOrigin = "anonymous"; // precisa de CORS se vier de outro domínio
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null); // sem roupa se falhar
      img.src = url;
    }));
  }
  return imageCache.get(url);
}

// Cabeça: troca só o amarelo da pele (rosto preto é mantido)
function recolorHead(source, color) {
  const w = source.width, h = source.height;
  const out = new ImageData(new Uint8ClampedArray(source.data), w, h);
  const px = out.data;
  const to = hexToRgb(color);
  const LIMIT = 40 * 40;
  for (let i = 0; i < px.length; i += 4) {
    const dr = px[i] - ORIGINAL_SKIN[0];
    const dg = px[i + 1] - ORIGINAL_SKIN[1];
    const db = px[i + 2] - ORIGINAL_SKIN[2];
    if (dr * dr + dg * dg + db * db < LIMIT) {
      px[i] = to[0]; px[i + 1] = to[1]; px[i + 2] = to[2];
    }
  }
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  canvas.getContext("2d").putImageData(out, 0, 0);
  return canvas;
}

// Corpo: cor da pele + pants (torso/pernas) + shirt (torso/braços), nessa ordem
function bodyCanvas(part, color, shirtImg, pantsImg) {
  const c = document.createElement("canvas");
  c.width = TW;
  c.height = TH;
  const ctx = c.getContext("2d");
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, TW, TH);
  const usesPants = part === "Torso" || part === "LeftLeg" || part === "RightLeg";
  const usesShirt = part === "Torso" || part === "LeftArm" || part === "RightArm";
  if (usesPants && pantsImg) ctx.drawImage(pantsImg, 0, 0, TW, TH);
  if (usesShirt && shirtImg) ctx.drawImage(shirtImg, 0, 0, TW, TH);
  return c;
}

function resolveColors(c) {
  const head = c.head || DEFAULT_COLORS.head;
  const torso = c.torso || DEFAULT_COLORS.torso;
  const leftLeg = c.leftLeg || DEFAULT_COLORS.leftLeg;
  const leftArm = c.leftArm || head;
  return {
    Head: head,
    Torso: torso,
    LeftArm: leftArm,
    RightArm: c.rightArm || leftArm,
    LeftLeg: leftLeg,
    RightLeg: c.rightLeg || leftLeg,
  };
}

// Cópia do noob com as cores/roupas do usuário (não mexe no modelo base)
function buildAvatar(colors, shirtImg, pantsImg) {
  const model = base.model.clone(true);
  const disposables = [];

  model.traverse((o) => {
    if (!o.isMesh) return;
    const part = partOf(o.name);
    if (!part) return;

    const source = part === "Head"
      ? recolorHead(base.headSource, colors.Head)
      : bodyCanvas(part, colors[part], shirtImg, pantsImg);

    const tex = new THREE.CanvasTexture(source);
    tex.flipY = false; // UVs do glTF
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.anisotropy = 4;
    tex.needsUpdate = true;

    o.material = new THREE.MeshLambertMaterial({ map: tex, side: THREE.DoubleSide });
    disposables.push(tex, o.material);
  });

  return { model, disposables };
}

/* ------------------------------------------------------------------ */
/*  Enquadramento (igual ao anterior)                                  */
/* ------------------------------------------------------------------ */
function placeCamera(target, dist, azDeg, elDeg) {
  const az = THREE.MathUtils.degToRad(azDeg);
  const el = THREE.MathUtils.degToRad(elDeg);
  camera.position.set(
    target.x + Math.sin(az) * Math.cos(el) * dist,
    target.y + Math.sin(el) * dist,
    target.z + Math.cos(az) * Math.cos(el) * dist
  );
  camera.lookAt(target);
}

function frame(kind) {
  const H = base.height;
  const tanHalf = Math.tan(THREE.MathUtils.degToRad(FOV) / 2);

  if (kind === "headshot") {
    const headSize = H / 5;
    const target = new THREE.Vector3(0, H - headSize * 0.5, 0);
    const dist = (headSize * 1.6) / (2 * tanHalf);
    placeCamera(target, dist, -12, 5);
  } else {
    const AZIMUTE = 36;
    const ELEVACAO = 18;
    const target = new THREE.Vector3(0, H * 0.5, 0);
    const dist = (H * 1.35) / (2 * tanHalf);
    placeCamera(target, dist, AZIMUTE, ELEVACAO);
  }
}

/* ------------------------------------------------------------------ */
/*  Render                                                             */
/* ------------------------------------------------------------------ */
let lastPx = 0;

function renderNow(cfg) {
  const size = cfg.size;
  const ss = size <= 1024 ? 2 : 1;
  const px = size * ss;
  if (px !== lastPx) {
    renderer.setSize(px, px, false);
    lastPx = px;
  }

  const { model, disposables } = buildAvatar(cfg.colors, cfg.shirtImg, cfg.pantsImg);
  scene.add(model);
  frame(cfg.kind);
  renderer.render(scene, camera);

  let url;
  if (ss === 1) {
    url = renderer.domElement.toDataURL("image/png");
  } else {
    const out = document.createElement("canvas");
    out.width = size;
    out.height = size;
    const ctx = out.getContext("2d");
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(renderer.domElement, 0, 0, size, size);
    url = out.toDataURL("image/png");
  }

  scene.remove(model);
  for (const d of disposables) d.dispose();
  return url;
}

/* ------------------------------------------------------------------ */
/*  PRÉ-LOAD                                                           */
/* ------------------------------------------------------------------ */
const ready = (async () => {
  base = await loadBase();
  const warm = resolveColors(DEFAULT_COLORS);
  renderNow({ kind: "headshot", size: 64, colors: warm });
  renderNow({ kind: "body", size: 64, colors: warm });
  window.__ready = true;
})();
ready.catch((e) => {
  console.error(e);
  window.__error = String(e);
});

/* ------------------------------------------------------------------ */
/*  API pública                                                        */
/*                                                                     */
/*  renderAvatar({                                                     */
/*    kind: "headshot" | "body", size: 420,                            */
/*    colors: { head, torso, leftArm, rightArm, leftLeg, rightLeg },   */
/*    shirt: "/uploads/shirt.png",   // template 585x559 (opcional)    */
/*    pants: "/uploads/pants.png",   // template 585x559 (opcional)    */
/*  })                                                                 */
/* ------------------------------------------------------------------ */
const cache = new Map();
let queue = Promise.resolve();

window.renderAvatar = (cfg) => {
  const colors = resolveColors(cfg.colors || {});
  const key = JSON.stringify([cfg.kind, cfg.size, colors, cfg.shirt || null, cfg.pants || null]);

  if (cache.has(key)) return Promise.resolve(cache.get(key));

  const job = queue.then(async () => {
    await ready;
    if (cache.has(key)) return cache.get(key);
    const [shirtImg, pantsImg] = await Promise.all([loadImage(cfg.shirt), loadImage(cfg.pants)]);
    const url = renderNow({ kind: cfg.kind, size: cfg.size, colors, shirtImg, pantsImg });
    cache.set(key, url);
    if (cache.size > MAX_CACHE) cache.delete(cache.keys().next().value);
    return url;
  });
  queue = job.catch(() => {});
  return job;
};

/* ------------------------------------------------------------------ */
/*  Texturas para a miniatura 3D (OBJ + MTL)                           */
/*                                                                     */
/*  buildTextures3D({ colors }) devolve um PNG (base64, sem prefixo)   */
/*  por parte: Head (rosto), Torso, LeftArm, RightArm, LeftLeg,        */
/*  RightLeg. As partes do corpo são cor chapada, então basta 8x8.     */
/* ------------------------------------------------------------------ */
const pngBase64 = (canvas) =>
  canvas.toDataURL("image/png").replace(/^data:image\/png;base64,/, "");

function flatPng(hex) {
  const c = document.createElement("canvas");
  c.width = 8;
  c.height = 8;
  const ctx = c.getContext("2d");
  ctx.fillStyle = hex;
  ctx.fillRect(0, 0, 8, 8);
  return pngBase64(c);
}

window.buildTextures3D = async (cfg) => {
  await ready;
  const colors = resolveColors((cfg && cfg.colors) || {});
  return {
    Head: pngBase64(recolorHead(base.headSource, colors.Head)),
    Torso: flatPng(colors.Torso),
    LeftArm: flatPng(colors.LeftArm),
    RightArm: flatPng(colors.RightArm),
    LeftLeg: flatPng(colors.LeftLeg),
    RightLeg: flatPng(colors.RightLeg),
  };
};
</script>
</body>
</html>
