<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>html,body{margin:0;background:transparent}</style>
  <script type="importmap">
    { "imports": { "three": "/vendor/three/build/three.module.js" } }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";

function faceTexture(headColor) {
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const g = c.getContext("2d");
  g.fillStyle = headColor;
  g.fillRect(0, 0, 128, 128);
  g.fillStyle = "#1b1b1b";
  g.beginPath(); g.ellipse(44, 52, 7, 11, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(84, 52, 7, 11, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = "#1b1b1b";
  g.lineWidth = 6;
  g.lineCap = "round";
  g.beginPath(); g.arc(64, 70, 28, 0.2 * Math.PI, 0.8 * Math.PI); g.stroke();
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function part(w, h, d, color, x, y, z, materials) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    materials || new THREE.MeshLambertMaterial({ color })
  );
  mesh.position.set(x, y, z);
  return mesh;
}

function buildNoob(colors) {
  const group = new THREE.Group();
  const solid = (c) => new THREE.MeshLambertMaterial({ color: c });

  // Cabeça: material por face; o rosto vai na face +z (índice 4)
  const headMats = [0, 1, 2, 3, 4, 5].map(() => solid(colors.head));
  headMats[4] = new THREE.MeshLambertMaterial({ map: faceTexture(colors.head) });

  group.add(part(1.2, 1.1, 1.2, null, 0, 4.55, 0, headMats));      // cabeça
  group.add(part(2, 2, 1, colors.torso, 0, 3, 0));                  // torso
  group.add(part(1, 2, 1, colors.leftArm, -1.5, 3, 0));             // braço esquerdo
  group.add(part(1, 2, 1, colors.rightArm, 1.5, 3, 0));             // braço direito
  group.add(part(1, 2, 1, colors.leftLeg, -0.5, 1, 0));             // perna esquerda
  group.add(part(1, 2, 1, colors.rightLeg, 0.5, 1, 0));             // perna direita
  return group;
}

window.renderAvatar = (cfg) => {
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(cfg.size, cfg.size);
  renderer.setClearColor(0x000000, 0);

  const scene = new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff, 0.85));
  const sun = new THREE.DirectionalLight(0xffffff, 1.1);
  sun.position.set(5, 10, 8);
  scene.add(sun);

  scene.add(buildNoob(cfg.colors));

  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
  if (cfg.kind === "headshot") {
    camera.position.set(1.6, 4.8, 4.8);
    camera.lookAt(0, 4.5, 0);
  } else {
    camera.position.set(5, 4.2, 13);
    camera.lookAt(0, 2.7, 0);
  }

  renderer.render(scene, camera);
  const url = renderer.domElement.toDataURL("image/png");

  scene.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => {
      if (m.map) m.map.dispose();
      m.dispose();
    });
  });
  renderer.dispose();
  return url;
};

window.__ready = true;
</script>
</body>
</html>
