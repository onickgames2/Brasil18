<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>html,body{margin:0;background:transparent}</style>
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

// Cores originais da textura do noob (amarelo = cabeça/braços, azul = torso, verde = pernas)
const ORIGINAL = {
  skin:  [245, 205, 48],
  torso: [13, 105, 172],
  legs:  [164, 189, 71],
};

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

// Troca as cores chapadas da textura pelas cores do usuário (o rosto preto é mantido)
function recolorTexture(map, colors) {
  const img = map.image;
  const w = img.width, h = img.height;
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0);

  const data = ctx.getImageData(0, 0, w, h);
  const px = data.data;
  const targets = [
    { from: ORIGINAL.skin,  to: hexToRgb(colors.head) },
    { from: ORIGINAL.torso, to: hexToRgb(colors.torso) },
    { from: ORIGINAL.legs,  to: hexToRgb(colors.leftLeg) },
  ];
  const LIMIT = 40 * 40;

  for (let i = 0; i < px.length; i += 4) {
    for (const t of targets) {
      const dr = px[i] - t.from[0];
      const dg = px[i + 1] - t.from[1];
      const db = px[i + 2] - t.from[2];
      if (dr * dr + dg * dg + db * db < LIMIT) {
        px[i] = t.to[0];
        px[i + 1] = t.to[1];
        px[i + 2] = t.to[2];
        break;
      }
    }
  }
  ctx.putImageData(data, 0, 0);
  map.image = canvas;
  map.needsUpdate = true;
}

async function loadNoob(colors) {
  const gltf = await new GLTFLoader().loadAsync("/noob.glb");
  const model = gltf.scene;

  model.traverse((o) => {
    if (!o.isMesh) return;
    recolorTexture(o.material.map, colors);
    o.material = new THREE.MeshLambertMaterial({
      map: o.material.map,
      side: THREE.DoubleSide,
    });
  });

  // O modelo original olha para -X: gira pra olhar para a câmera (+Z)
  model.rotation.y = Math.PI / 2;
  model.updateMatrixWorld(true);

  // Centraliza em X/Z e apoia os pés em y = 0
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  model.position.set(-center.x, -box.min.y, -center.z);
  return model;
}

window.renderAvatar = async (cfg) => {
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(cfg.size, cfg.size);
  renderer.setClearColor(0x000000, 0);

  const scene = new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff, 0.8 * Math.PI));
  const sun = new THREE.DirectionalLight(0xffffff, 0.9 * Math.PI);
  sun.position.set(5, 10, 8);
  scene.add(sun);

  scene.add(await loadNoob(cfg.colors));

  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
  if (cfg.kind === "headshot") {
    camera.position.set(1.5, 4.6, 6.5);
    camera.lookAt(0, 4.4, 0);
  } else {
    camera.position.set(5, 4.2, 13);
    camera.lookAt(0, 2.7, 0);
  }

  renderer.render(scene, camera);
  const url = renderer.domElement.toDataURL("image/png");

  scene.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      if (o.material.map) o.material.map.dispose();
      o.material.dispose();
    }
  });
  renderer.dispose();
  return url;
};

window.__ready = true;
</script>
</body>
</html>
