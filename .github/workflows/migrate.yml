name: Run DB migrations

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find migrations folder
        id: find
        run: |
          FILE=$(find . -name '20210112161653_addUsersTable*' -not -path '*/node_modules/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "Migration 20210112161653_addUsersTable not found"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Migrations folder: $DIR"
          echo "Files: $(ls "$DIR" | wc -l)"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare isolated environment
        run: |
          mkdir -p /tmp/migrate
          cp -r "${{ steps.find.outputs.dir }}" /tmp/migrate/migrations
          cd /tmp/migrate
          npm init -y > /dev/null
          npm install knex pg --no-audit --no-fund
          for f in migrations/*.js; do
            if grep -qE '^export ' "$f"; then
              echo "Converting ESM to CommonJS: $f"
              sed -i -E 's/^export async function (up|down)\(/exports.\1 = async function (/; s/^export function (up|down)\(/exports.\1 = function (/' "$f"
            fi
          done
          cat > knexfile.cjs <<'EOF'
          module.exports = {
            client: 'pg',
            connection: {
              connectionString: process.env.DATABASE_URL,
              ssl: { rejectUnauthorized: false },
            },
            pool: { min: 0, max: 2 },
            migrations: {
              directory: __dirname + '/migrations',
              tableName: 'knex_migrations',
            },
          };
          EOF

      - name: Diagnose connection (does not print the password)
        working-directory: /tmp/migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cat > diag.cjs <<'EOF'
          const { Client } = require('pg');
          const raw = process.env.DATABASE_URL || '';
          console.log('secret empty?', raw.length === 0);
          console.log('secret length:', raw.length);
          try {
            const u = new URL(raw);
            const pass = decodeURIComponent(u.password);
            console.log('user:', decodeURIComponent(u.username));
            console.log('host:', u.hostname);
            console.log('port:', u.port);
            console.log('database:', u.pathname);
            console.log('password length:', pass.length);
            console.log('password has space:', /\s/.test(pass));
            console.log('password has brackets:', /[\[\]]/.test(pass));
          } catch (e) {
            console.log('URL parse error:', e.message);
          }
          (async () => {
            const client = new Client({ connectionString: raw, ssl: { rejectUnauthorized: false } });
            try {
              await client.connect();
              const r = await client.query('select current_user, current_database()');
              console.log('CONNECTED:', JSON.stringify(r.rows[0]));
            } catch (e) {
              console.log('CONNECT FAILED:', e.message);
            } finally {
              await client.end().catch(() => {});
            }
          })();
          EOF
          node diag.cjs

      - name: Run migrations
        working-directory: /tmp/migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx knex --knexfile knexfile.cjs migrate:latest
